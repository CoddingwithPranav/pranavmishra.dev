services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433 avoids clashing with other local Postgres containers.
      # Containers still talk to this DB as "db:5432" over the compose network.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      # Keep the image's node_modules (Alpine/musl native binaries such as
      # Prisma engines) instead of shadowing them with the host's.
      - /usr/src/app/node_modules
    command: sh ./entrypoint.sh

  prisma-studio:
    # Reuse the app image so the Prisma CLI + generated client are available.
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '5555:5555'
    depends_on:
      db:
        condition: service_healthy
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      # Keep the image's node_modules (contains the prisma binary).
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    command: npx prisma studio --port 5555
    env_file:
      - .env

volumes:
  postgres_data: